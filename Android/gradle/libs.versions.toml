[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
activityCompose = "1.13.0"
libmpv = "0.4.1"
serialization = "1.12.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"
