# XcodeGen spec. After editing, run `xcodegen generate` and commit the result.
name: RetroGuide
options:
  bundleIdPrefix: com.adamhunt
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RetroGuideKit:
    path: Packages/RetroGuideKit
  # MPVKit 1.0.0 with libmpv patched so audio route changes can't crash playback
  # (see the fork's README and patch).
  MPVKit:
    url: https://github.com/shikyo13/MPVKit
    exactVersion: 1.0.0-retroguide.1
  # Ads in the free version on iPhone and iPad (not Apple TV); includes Google's consent SDK.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.10.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  RetroGuide:
    type: application
    # One app for Apple TV, iPhone and iPad (same bundle ID, one App Store listing).
    supportedDestinations: [tvOS, iOS]
    sources:
      - path: App
    dependencies:
      - package: RetroGuideKit
      # LGPL build of libmpv (not the -GPL product); see NOTICE.
      - package: MPVKit
        product: MPVKit
      # Linked explicitly: the display-mode API is an AVKit category on UIWindow,
      # which references no symbols, so automatic linking would drop it.
      - sdk: AVKit.framework
      - package: GoogleMobileAds
        product: GoogleMobileAds
        destinationFilters: [iOS]
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
        destinationFilters: [iOS]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: RetroGuide.TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        # iPhone and iPad; ignored on tvOS.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: RetroGuide.TV connects to your media server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only standard HTTPS is used, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # AdMob (iPhone and iPad free version). IDs come from Config/Ads.xcconfig.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        RetroGuideAdMobBannerUnitID: $(ADMOB_BANNER_UNIT_ID)
        RetroGuideAdMobInterstitialUnitID: $(ADMOB_INTERSTITIAL_UNIT_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          ADMOB_APP_ID: $(ADMOB_DEMO_APP_ID)
          ADMOB_BANNER_UNIT_ID: $(ADMOB_DEMO_BANNER_UNIT_ID)
          ADMOB_INTERSTITIAL_UNIT_ID: $(ADMOB_DEMO_INTERSTITIAL_UNIT_ID)
        Release:
          ADMOB_APP_ID: $(ADMOB_RELEASE_APP_ID)
          ADMOB_BANNER_UNIT_ID: $(ADMOB_RELEASE_BANNER_UNIT_ID)
          ADMOB_INTERSTITIAL_UNIT_ID: $(ADMOB_RELEASE_INTERSTITIAL_UNIT_ID)
schemes:
  RetroGuide:
    build:
      targets:
        RetroGuide: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
      postActions:
        - name: Remove codeless framework stubs
          settingsTarget: RetroGuide
          script: '"${SRCROOT}/Scripts/remove-codeless-framework-stubs.sh" "${ARCHIVE_PATH}"'
