# XcodeGen spec. After editing, run `xcodegen generate` and commit the result.
name: RetroGuide
options:
  bundleIdPrefix: com.adamhunt
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RetroGuideKit:
    path: Packages/RetroGuideKit
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  RetroGuide:
    type: application
    platform: tvOS
    sources:
      - path: App
    dependencies:
      - package: RetroGuideKit
      # LGPL build of libmpv (not the -GPL product); see NOTICE.
      - package: MPVKit
        product: MPVKit
    postBuildScripts:
      - name: Fix embedded framework versions
        script: '"${SRCROOT}/Scripts/fix-embedded-framework-versions.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: RetroGuide.TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: RetroGuide.TV connects to your media server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only standard HTTPS is used, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        # The framework version fix-up script edits the app bundle in place.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  RetroGuide:
    build:
      targets:
        RetroGuide: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
