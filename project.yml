# XcodeGen spec. After editing, run `xcodegen generate` and commit the result.
name: RetroGuide
options:
  bundleIdPrefix: com.adamhunt
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "20261103.2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RetroGuideKit:
    path: Packages/RetroGuideKit
  # MPVKit 1.0.0 with libmpv patched: audio route changes can't crash playback, and the
  # AVFoundation audio output is paced. FFmpeg also reads external VobSub pairs on iOS/tvOS.
  MPVKit:
    url: https://github.com/shikyo13/MPVKit
    exactVersion: 1.0.0-retroguide.4
  # Ads in the free version on iPhone and iPad (not Apple TV); includes Google's consent SDK.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.10.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.1.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  RetroGuide:
    type: application
    # One app for Apple TV, iPhone and iPad (same bundle ID, one App Store listing).
    supportedDestinations: [tvOS, iOS]
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: RetroGuideTopShelf
        embed: true
        destinationFilters: [tvOS]
      - target: RetroGuideWidgets
        embed: true
        destinationFilters: [iOS]
      - package: RetroGuideKit
      # LGPL build of libmpv (not the -GPL product); see NOTICE.
      - package: MPVKit
        product: MPVKit
      # Linked explicitly: the display-mode API is an AVKit category on UIWindow,
      # which references no symbols, so automatic linking would drop it.
      - sdk: AVKit.framework
      - package: GoogleMobileAds
        product: GoogleMobileAds
        destinationFilters: [iOS]
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
        destinationFilters: [iOS]
    entitlements:
      path: App/Resources/RetroGuide.entitlements
      properties:
        # Read previous audio and subtitle choices during migration to CloudKit.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.icloud-container-identifiers: [iCloud.com.adamhunt.retroguide]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: $(RETROGUIDE_ICLOUD_ENVIRONMENT)
        aps-environment: development
        # Shared with the What's On widget (its schedule and artwork).
        com.apple.security.application-groups: [group.com.adamhunt.retroguide]
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: RetroGuide.TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        # iPhone and iPad; ignored on tvOS.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        # The What's On widget opens a channel with retroguide://channel?id=…
        CFBundleURLTypes:
          - CFBundleURLName: com.adamhunt.retroguide
            CFBundleURLSchemes: [retroguide]
        # Picture in Picture keeps the channel playing with the app in the background.
        UIBackgroundModes: [audio, remote-notification]
        NSLocalNetworkUsageDescription: RetroGuide.TV connects to your media server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: false
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsForMedia: false
        # Only standard HTTPS is used, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        # AdMob (iPhone and iPad free version). IDs come from Config/Ads.xcconfig.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        RetroGuideAdMobBannerUnitID: $(ADMOB_BANNER_UNIT_ID)
        RetroGuideAdMobInterstitialUnitID: $(ADMOB_INTERSTITIAL_UNIT_ID)
        RetroGuideAttributionURL: $(ATTRIBUTION_ENDPOINT)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=appletv*]:
          - TVAppIcon-localForecast
          - TVAppIcon-saturdayMorning
          - TVAppIcon-payPerView
          - TVAppIcon-woodPanel
          - TVAppIcon-vhs
          - TVAppIcon-synthwave
          - TVAppIcon-midnight
          - TVAppIcon-crtGreen
          - TVAppIcon-amber
          - TVAppIcon-teletext
          - TVAppIcon-mono
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]: AppIcon
        # One icon per Pro theme (Tools/BrandAssets), chosen with the theme.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphone*]: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          RETROGUIDE_ICLOUD_ENVIRONMENT: Development
          ADMOB_APP_ID: $(ADMOB_DEMO_APP_ID)
          ADMOB_BANNER_UNIT_ID: $(ADMOB_DEMO_BANNER_UNIT_ID)
          ADMOB_INTERSTITIAL_UNIT_ID: $(ADMOB_DEMO_INTERSTITIAL_UNIT_ID)
        Release:
          RETROGUIDE_ICLOUD_ENVIRONMENT: Production
          ADMOB_APP_ID: $(ADMOB_RELEASE_APP_ID)
          ADMOB_BANNER_UNIT_ID: $(ADMOB_RELEASE_BANNER_UNIT_ID)
          ADMOB_INTERSTITIAL_UNIT_ID: $(ADMOB_RELEASE_INTERSTITIAL_UNIT_ID)
  RetroGuideTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: Shared/WhatsOnSnapshot.swift
      - path: App/DesignSystem/Theme
      - path: App/DesignSystem/Tokens/DesignTokens.swift
      - path: App/DesignSystem/Tokens/Typography.swift
      - path: App/DesignSystem/Tokens/PlatformMetric.swift
      - path: App/DesignSystem/Components/ChannelBadge.swift
      - path: App/DesignSystem/Components/Surfaces.swift
      - path: App/DesignSystem/Components/RetroRowButtonStyle.swift
      - path: App/DesignSystem/Components/TopShelfCard.swift
    dependencies:
      - package: RetroGuideKit
    entitlements:
      path: TopShelf/RetroGuideTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.adamhunt.retroguide]
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: RetroGuide.TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide.topshelf
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # The What's On home-screen widget (iPhone and iPad).
  RetroGuideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/DesignSystem/Components/TVGlyph.swift
      - path: App/DesignSystem/Theme/Color+Hex.swift
    entitlements:
      path: Widgets/RetroGuideWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.adamhunt.retroguide]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: RetroGuide.TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide.widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # UI tests that drive a connected iPhone (development only).
  RetroGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RetroGuide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide.uitests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RetroGuide
schemes:
  RetroGuideUITests:
    build:
      targets:
        RetroGuide: [test]
        RetroGuideUITests: [test]
    test:
      config: Debug
      targets:
        - RetroGuideUITests
  RetroGuide:
    build:
      targets:
        RetroGuide: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
      postActions:
        - name: Prepare tvOS alternate icon metadata
          settingsTarget: RetroGuide
          script: 'xcrun swift "${SRCROOT}/Scripts/prepare-tvos-icons.swift" "${ARCHIVE_PATH}/Products/Applications/RetroGuide.app/Info.plist"'
        - name: Remove codeless framework stubs
          settingsTarget: RetroGuide
          script: '"${SRCROOT}/Scripts/remove-codeless-framework-stubs.sh" "${ARCHIVE_PATH}"'
