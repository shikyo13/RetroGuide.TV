# XcodeGen spec. After editing, run `xcodegen generate` and commit the result.
name: RetroGuide
options:
  bundleIdPrefix: com.adamhunt
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RetroGuideKit:
    path: Packages/RetroGuideKit
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  RetroGuide:
    type: application
    # One app for Apple TV, iPhone and iPad (same bundle ID, one App Store listing).
    supportedDestinations: [tvOS, iOS]
    sources:
      - path: App
    dependencies:
      - package: RetroGuideKit
      # LGPL build of libmpv (not the -GPL product); see NOTICE.
      - package: MPVKit
        product: MPVKit
    postBuildScripts:
      - name: Remove codeless framework stubs
        script: '"${SRCROOT}/Scripts/remove-codeless-framework-stubs.sh"'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: RetroGuide.TV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        # iPhone and iPad; ignored on tvOS.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: RetroGuide.TV connects to your media server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only standard HTTPS is used, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamhunt.retroguide
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        # The post-build script removes empty framework bundles from the built app.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  RetroGuide:
    build:
      targets:
        RetroGuide: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
