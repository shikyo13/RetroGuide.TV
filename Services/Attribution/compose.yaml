services:
  attribution:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8084:8080"]
    environment:
      ATTRIBUTION_DATABASE: /data/attribution.sqlite
      APPLE_ROOT_CERTIFICATES: /certificates
      STORE_ENVIRONMENT: Production
    volumes:
      - attribution-data:/data
      - ${APPLE_ROOT_CERTIFICATES:?Set the certificate directory}:/certificates:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
volumes:
  attribution-data:
